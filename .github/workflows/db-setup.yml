name: Database setup

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run seed after migrations"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  migrate-and-seed:
    name: Run database migrations and seed
    runs-on: ubuntu-latest

    steps:
      - name: Check DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL GitHub secret is missing."
            echo "Add it in: Repository Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Run seed
        if: ${{ github.event.inputs.run_seed == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed
